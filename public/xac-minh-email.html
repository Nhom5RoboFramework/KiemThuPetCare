<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác minh email - PetCare</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div>
<main class="container"><div class="card form-card">
  <h1>Xác minh email</h1>
  <p class="sub" id="verificationMessage">Đang xác minh địa chỉ email của bạn...</p>
  <p><a href="login.html" id="loginLink">Đến trang đăng nhập</a></p>
</div></main>
<script src="js/app.js"></script>
<script>
(async function () {
  const message = document.getElementById('verificationMessage');
  const token = new URLSearchParams(location.search).get('token');
  if (!token) { message.textContent = 'Liên kết xác minh không hợp lệ hoặc đã hết hạn.'; return; }
  const result = await PetCare.call('POST', '/api/auth/verify-email', { token });
  message.textContent = result.data.message || result.data.error || 'Không thể xác minh email.';
  if (result.status === 200) message.id = 'verifySuccess';
  else message.id = 'verifyError';
})();
</script></body></html>

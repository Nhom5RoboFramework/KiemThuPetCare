<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết sản phẩm - PetCare</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div>
<main class="container">
  <p class="sub"><a href="index.html" id="backLink">‹ Quay lại danh sách</a></p>
  <div class="card"><div class="alert" id="loadError"></div>
    <div class="detail" id="detailBox" style="display:none">
      <div class="product-image" id="productImage"></div>
      <div class="info">
        <span class="category-tag" id="productCategory"></span>
        <h1 id="productName"></h1>
        <p class="product-price" id="productPrice"></p>
        <p id="productDescription"></p>
        <p class="product-stock" id="productStock"></p>
        <div class="qty-row"><label for="quantity">Số lượng</label><input id="quantity" type="number" min="1" value="1">
          <button class="btn" id="addToCartButton" type="button">Thêm vào giỏ hàng</button></div>
        <div class="alert" id="message"></div><div class="success" id="successMessage"></div>
      </div>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
<script>
(async function () {
  const { $, money, call, setMsg } = PetCare;
  await PetCare.ready;
  const id = new URLSearchParams(location.search).get('id');
  const r = await call('GET', '/api/products/' + encodeURIComponent(id || ''));
  if (r.status !== 200) { setMsg('loadError', r.data.error || 'Không tải được sản phẩm.'); return; }
  const p = r.data;
  $('detailBox').style.display = 'flex';
  document.title = p.name + ' - PetCare';
  $('productImage').textContent = p.image; $('productCategory').textContent = p.category; $('productName').textContent = p.name;
  $('productPrice').textContent = money(p.price); $('productDescription').textContent = p.description;
  const out = p.stock === 0;
  $('productStock').textContent = out ? 'Hết hàng' : 'Còn ' + p.stock + ' sản phẩm';
  $('productStock').classList.toggle('out', out);
  if (out) { $('addToCartButton').disabled = true; $('addToCartButton').textContent = 'Hết hàng'; $('quantity').disabled = true; }
  $('addToCartButton').addEventListener('click', async () => {
    setMsg('message', ''); setMsg('successMessage', '');
    if (!PetCare.user()) { location.href = 'login.html?next=' + encodeURIComponent('product.html?id=' + p.id); return; }
    const r2 = await call('POST', '/api/cart', { productId: p.id, quantity: $('quantity').value });
    if (r2.status === 201) { setMsg('successMessage', 'Đã thêm vào giỏ hàng.'); PetCare.refreshCartCount(); }
    else if (r2.status === 401) location.href = 'login.html?next=' + encodeURIComponent('product.html?id=' + p.id);
    else setMsg('message', r2.data.error);
  });
})();
</script></body></html>
